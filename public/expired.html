<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="only light">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记已过期 - WebNote</title>
    <style>html{background:#F3EEE6;color:#2B2520}</style>
    <script>
        // Prevent FOUC: set theme AND inline bg BEFORE CSS loads
        (function(){
            var t = localStorage.getItem('webnote-theme');
            if (!t) {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
            // Set bg inline on html — highest specificity, no flash possible
            document.documentElement.style.backgroundColor = t === 'dark' ? '#0E0E0E' : '#F3EEE6';
            document.documentElement.style.color = t === 'dark' ? '#FFFFFF' : '#2B2520';
        })();
    </script>
    <style>
:root {
  /* Heatherwick (亮色模式) */
  --bg: #F3EEE6;
  --surface: #EAE2D6;
  --surface-raised: #E2D9CA;
  --text: #2B2520;
  --text-2: #6E6051;
  --border: #D8CDBE;
  --radius-sm: 3px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --primary: #B87333;
  --primary-light: #C99A5B;
  --primary-dark: #A05E22;
  --primary-gradient: linear-gradient(135deg, #B87333 0%, #C99A5B 100%);
  --success: #5B8C5A;
  --danger: #B85C4A;
  --on-primary: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(120,80,40,.08);
  --shadow-md: 0 4px 15px rgba(120,80,40,.12);
  --shadow-lg: 0 10px 30px rgba(120,80,40,.12);
  --bg-glow-1: radial-gradient(80vw 60vw at 80% 0%, rgba(184,115,51,.10), transparent 60%);
  --bg-glow-2: radial-gradient(50vw 50vw at 0% 100%, rgba(140,140,140,.08), transparent 60%);
  --header-text: var(--text);
  --header-muted: var(--text-2);
  --btn-secondary-bg: #DDD2C4;
  --btn-secondary-text: var(--text);
  --btn-secondary-hover: #D0C5B5;
  --input-bg: #F7F3ED;
}

/* data-theme driven, no @media query needed */
:root[data-theme="light"] {
  --bg: #F3EEE6; --surface: #EAE2D6; --surface-raised: #E2D9CA;
  --text: #2B2520; --text-2: #6E6051; --border: #D8CDBE;
  --radius-sm: 3px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
  --primary: #B87333; --primary-light: #C99A5B; --primary-dark: #A05E22;
  --primary-gradient: linear-gradient(135deg, #B87333 0%, #C99A5B 100%);
  --success: #5B8C5A; --danger: #B85C4A;
  --on-primary: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(120,80,40,.08);
  --shadow-md: 0 4px 15px rgba(120,80,40,.12);
  --shadow-lg: 0 10px 30px rgba(120,80,40,.12);
  --bg-glow-1: radial-gradient(80vw 60vw at 80% 0%, rgba(184,115,51,.10), transparent 60%);
  --bg-glow-2: radial-gradient(50vw 50vw at 0% 100%, rgba(140,140,140,.08), transparent 60%);
  --header-text: #2B2520;
  --header-muted: #6E6051;
  --btn-secondary-bg: #DDD2C4;
  --btn-secondary-text: #2B2520;
  --btn-secondary-hover: #D0C5B5;
  --input-bg: #F7F3ED;
}

:root[data-theme="dark"] {
  --bg: #0E0E0E; --surface: #161616; --surface-raised: #1E1E1E;
  --text: #FFFFFF; --text-2: #BBBBBB; --border: #333333;
  --radius-sm: 2px; --radius-md: 6px; --radius-lg: 10px; --radius-xl: 14px;
  --primary: #FF6A00; --primary-light: #FFB066; --primary-dark: #CC5500;
  --primary-gradient: linear-gradient(135deg, #FF6A00 0%, #FFB066 100%);
  --success: #66BB6A; --danger: #EF5350;
  --on-primary: #0E0E0E;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 15px rgba(0,0,0,.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  --bg-glow-1: radial-gradient(120vw 120vw at 50% -10%, rgba(255,106,0,.10), transparent 55%);
  --bg-glow-2: none;
  --header-text: #FFFFFF;
  --header-muted: #BBBBBB;
  --btn-secondary-bg: #2A2A2A;
  --btn-secondary-text: #FFFFFF;
  --btn-secondary-hover: #3A3A3A;
  --input-bg: #1A1A1A;
}

    </style>
    <link rel="stylesheet" href="/styles.css?v=2">
    <style>
        .error-page {
            background: var(--surface);
            padding: 60px 40px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            text-align: center;
            border: 1px solid var(--border);
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 2rem;
            color: var(--danger);
            margin-bottom: 20px;
        }

        .error-message {
            color: var(--text-2);
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: var(--primary-gradient);
            color: var(--on-primary);
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            transition: transform .25s, box-shadow .25s;
            box-shadow: var(--shadow-sm);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .back-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .lang-switch-btn {
            background: color-mix(in srgb, var(--surface) 80%, transparent);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: .85rem;
            font-weight: 500;
            transition: all .25s;
        }

        .lang-switch-btn:hover {
            background: var(--surface);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .lang-switch-btn:active {
            transform: translateY(0);
        }

        .theme-toggle {
            background: color-mix(in srgb, var(--surface) 80%, transparent);
            border: 1px solid var(--border);
            color: var(--text);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .25s;
        }

        .theme-toggle:hover {
            background: var(--surface);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .theme-toggle:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="/" class="back-link" data-i18n="errors.expired.createNew">创建新笔记</a>
            <div style="display:flex;gap:8px;align-items:center">
                <button id="themeToggle" class="theme-toggle" title="切换主题">🌙</button>
                <button id="langSwitch" class="lang-switch-btn" data-i18n="langSwitch">English</button>
            </div>
        </div>
        
        <div class="error-page">
            <div class="error-icon" data-i18n="errors.expired.icon">⏰</div>
            <h1 class="error-title" data-i18n="errors.expired.title">笔记已过期</h1>
            <p class="error-message" data-i18n="errors.expired.message">
                很抱歉，您访问的笔记已经过期并被删除。<br>
                所有笔记在创建后7天自动过期。
            </p>
        </div>
    </div>

    <script>
                // Theme toggle (init already done in head)
        (function() {
            const root = document.documentElement;
            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                var cur = root.getAttribute('data-theme');
                toggle.textContent = cur === 'dark' ? '☀️' : '🌙';
                toggle.addEventListener('click', function() {
                    var t = root.getAttribute('data-theme');
                    var n = t === 'dark' ? 'light' : 'dark';
                    root.setAttribute('data-theme', n);
                    toggle.textContent = n === 'dark' ? '☀️' : '🌙';
                    localStorage.setItem('webnote-theme', n);
                });
            }
        })();
    </script>
    <script src="i18n.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                const translation = t(key);
                if (translation) {
                    element.textContent = translation;
                }
            });

            const langSwitchBtn = document.getElementById('langSwitch');
            if (langSwitchBtn) {
                langSwitchBtn.addEventListener('click', function() {
                    const currentLang = getCurrentLanguage();
                    const newLang = currentLang === 'zh' ? 'en' : 'zh';
                    setLanguage(newLang);
                });
            }
        });
    </script>
</body>
</html>
