<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="only light">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查看笔记 - WebNote</title>
    <style>html{background:#F3EEE6;color:#2B2520}</style>
    <script>
        // Prevent FOUC: set theme AND inline bg BEFORE CSS loads
        (function(){
            var t = localStorage.getItem('webnote-theme');
            if (!t) {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
            // Set bg inline on html — highest specificity, no flash possible
            document.documentElement.style.backgroundColor = t === 'dark' ? '#0E0E0E' : '#F3EEE6';
            document.documentElement.style.color = t === 'dark' ? '#FFFFFF' : '#2B2520';
        })();
    </script>
    <style>
:root {
  /* Heatherwick (亮色模式) */
  --bg: #F3EEE6;
  --surface: #EAE2D6;
  --surface-raised: #E2D9CA;
  --text: #2B2520;
  --text-2: #6E6051;
  --border: #D8CDBE;
  --radius-sm: 3px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --primary: #B87333;
  --primary-light: #C99A5B;
  --primary-dark: #A05E22;
  --primary-gradient: linear-gradient(135deg, #B87333 0%, #C99A5B 100%);
  --success: #5B8C5A;
  --danger: #B85C4A;
  --on-primary: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(120,80,40,.08);
  --shadow-md: 0 4px 15px rgba(120,80,40,.12);
  --shadow-lg: 0 10px 30px rgba(120,80,40,.12);
  --bg-glow-1: radial-gradient(80vw 60vw at 80% 0%, rgba(184,115,51,.10), transparent 60%);
  --bg-glow-2: radial-gradient(50vw 50vw at 0% 100%, rgba(140,140,140,.08), transparent 60%);
  --header-text: var(--text);
  --header-muted: var(--text-2);
  --btn-secondary-bg: #DDD2C4;
  --btn-secondary-text: var(--text);
  --btn-secondary-hover: #D0C5B5;
  --input-bg: #F7F3ED;
}

/* data-theme driven, no @media query needed */
:root[data-theme="light"] {
  --bg: #F3EEE6; --surface: #EAE2D6; --surface-raised: #E2D9CA;
  --text: #2B2520; --text-2: #6E6051; --border: #D8CDBE;
  --radius-sm: 3px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
  --primary: #B87333; --primary-light: #C99A5B; --primary-dark: #A05E22;
  --primary-gradient: linear-gradient(135deg, #B87333 0%, #C99A5B 100%);
  --success: #5B8C5A; --danger: #B85C4A;
  --on-primary: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(120,80,40,.08);
  --shadow-md: 0 4px 15px rgba(120,80,40,.12);
  --shadow-lg: 0 10px 30px rgba(120,80,40,.12);
  --bg-glow-1: radial-gradient(80vw 60vw at 80% 0%, rgba(184,115,51,.10), transparent 60%);
  --bg-glow-2: radial-gradient(50vw 50vw at 0% 100%, rgba(140,140,140,.08), transparent 60%);
  --header-text: #2B2520;
  --header-muted: #6E6051;
  --btn-secondary-bg: #DDD2C4;
  --btn-secondary-text: #2B2520;
  --btn-secondary-hover: #D0C5B5;
  --input-bg: #F7F3ED;
}

:root[data-theme="dark"] {
  --bg: #0E0E0E; --surface: #161616; --surface-raised: #1E1E1E;
  --text: #FFFFFF; --text-2: #BBBBBB; --border: #333333;
  --radius-sm: 2px; --radius-md: 6px; --radius-lg: 10px; --radius-xl: 14px;
  --primary: #FF6A00; --primary-light: #FFB066; --primary-dark: #CC5500;
  --primary-gradient: linear-gradient(135deg, #FF6A00 0%, #FFB066 100%);
  --success: #66BB6A; --danger: #EF5350;
  --on-primary: #0E0E0E;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 15px rgba(0,0,0,.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  --bg-glow-1: radial-gradient(120vw 120vw at 50% -10%, rgba(255,106,0,.10), transparent 55%);
  --bg-glow-2: none;
  --header-text: #FFFFFF;
  --header-muted: #BBBBBB;
  --btn-secondary-bg: #2A2A2A;
  --btn-secondary-text: #FFFFFF;
  --btn-secondary-hover: #3A3A3A;
  --input-bg: #1A1A1A;
}

    </style>
    <!-- SVG Symbol Sprite -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
      <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="4"/>
        <line x1="12" y1="20" x2="12" y2="22"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="2" y1="12" x2="4" y2="12"/>
        <line x1="20" y1="12" x2="22" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </symbol>
    </svg>
    <link rel="stylesheet" href="/styles.css?v=2">
    <style>
        .note-viewer {
            background: var(--surface);
            padding: 40px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            min-height: 400px;
            border: 1px solid var(--border);
        }

        .note-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .note-meta {
            color: var(--text-2);
            font-size: .9rem;
            margin-top: 10px;
        }

        .note-content {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: opacity .2s;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lang-switch-btn {
            background: color-mix(in srgb, var(--surface) 80%, transparent);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: .85rem;
            font-weight: 500;
            transition: all .25s;
        }

        .lang-switch-btn:hover {
            background: var(--surface);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .lang-switch-btn:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-2);
        }

        .error {
            text-align: center;
            padding: 60px 20px;
            color: var(--danger);
        }

        .copy-actions {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .theme-toggle {
            background: color-mix(in srgb, var(--surface) 80%, transparent);
            border: 1px solid var(--border);
            color: var(--text);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .25s;
        }

        .theme-toggle:hover {
            background: var(--surface);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .theme-toggle:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="/" class="back-link" id="backToHome">← 返回首页</a>
            <div style="display:flex;gap:8px;align-items:center">
                <button id="themeToggle" class="theme-toggle" title="切换主题" aria-label="切换主题">
                    <svg class="icon-theme"><use href="#icon-moon"/></svg>
                </button>
                <button id="langSwitch" class="lang-switch-btn">English</button>
            </div>
        </div>
        
        <div class="note-viewer">
            <div id="loading" class="loading">
                <p>加载中...</p>
            </div>
            
            <div id="error" class="error hidden">
                <p>笔记加载失败</p>
            </div>
            
            <div id="noteDisplay" class="hidden">
                <div class="note-header">
                    <h2 id="noteContentTitle">笔记内容</h2>
                    <div class="note-meta">
                        <p><span id="createdAtLabel">创建时间</span>: <span id="createdAt"></span></p>
                        <p><span id="expiresAtLabel">过期时间</span>: <span id="expiresAt"></span></p>
                    </div>
                </div>
                
                <div id="noteContent" class="note-content"></div>
                
                <div class="copy-actions">
                    <button id="copyContentBtn" class="btn btn-secondary">
                        复制内容
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme toggle (init already done in head)
        (function() {
            const root = document.documentElement;
            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                var cur = root.getAttribute('data-theme');
                var svg = toggle.querySelector('svg use');
                if (svg) svg.setAttribute('href', '#icon-' + (cur === 'dark' ? 'sun' : 'moon'));
                toggle.addEventListener('click', function() {
                    var t = root.getAttribute('data-theme');
                    var n = t === 'dark' ? 'light' : 'dark';
                    root.setAttribute('data-theme', n);
                    if (svg) svg.setAttribute('href', '#icon-' + (n === 'dark' ? 'sun' : 'moon'));
                    localStorage.setItem('webnote-theme', n);
                });
            }
        })();

        // i18n translations
        const translations = {
            zh: {
                backToHome: '← 返回首页',
                langSwitch: 'English',
                loading: '加载中...',
                loadFailed: '笔记加载失败',
                noteContentTitle: '笔记内容',
                createdAtLabel: '创建时间',
                expiresAtLabel: '过期时间',
                copyContent: '复制内容',
                copied: '已复制!'
            },
            en: {
                backToHome: '← Back to Home',
                langSwitch: '中文',
                loading: 'Loading...',
                loadFailed: 'Failed to load note',
                noteContentTitle: 'Note Content',
                createdAtLabel: 'Created at',
                expiresAtLabel: 'Expires at',
                copyContent: 'Copy Content',
                copied: 'Copied!'
            }
        };

        function getCurrentLanguage() {
            return localStorage.getItem('webnote-lang') || 
                   (navigator.language && navigator.language.startsWith('zh') ? 'zh' : 'en');
        }

        function setLanguage(lang) {
            localStorage.setItem('webnote-lang', lang);
            window.dispatchEvent(new CustomEvent('languageChanged', { detail: { lang } }));
        }

        function t(key) {
            const lang = getCurrentLanguage();
            return translations[lang]?.[key] || translations.en[key] || key;
        }

        function applyTranslations() {
            document.getElementById('backToHome').textContent = t('backToHome');
            document.getElementById('langSwitch').textContent = t('langSwitch');
            document.querySelector('#loading p').textContent = t('loading');
            document.querySelector('#error p').textContent = t('loadFailed');
            document.getElementById('noteContentTitle').textContent = t('noteContentTitle');
            document.getElementById('createdAtLabel').textContent = t('createdAtLabel');
            document.getElementById('expiresAtLabel').textContent = t('expiresAtLabel');
            document.getElementById('copyContentBtn').textContent = t('copyContent');
        }

        function init() {
            console.log('=== Initializing note viewer ===');
            window.currentNoteData = null;
            applyTranslations();

            window.addEventListener('languageChanged', function(event) {
                console.log('Language changed to:', event.detail.lang);
                applyTranslations();
                if (window.currentNoteData) {
                    const lang = event.detail.lang;
                    document.getElementById('createdAt').textContent = new Date(window.currentNoteData.createdAt).toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US');
                    document.getElementById('expiresAt').textContent = new Date(window.currentNoteData.expiresAt).toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US');
                }
            });

            document.getElementById('langSwitch').addEventListener('click', function() {
                const currentLang = getCurrentLanguage();
                const newLang = currentLang === 'zh' ? 'en' : 'zh';
                setLanguage(newLang);
            });

            const noteId = window.location.pathname.split('/').pop();
            console.log('Note ID:', noteId);

            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const noteDisplay = document.getElementById('noteDisplay');
            const noteContent = document.getElementById('noteContent');
            const createdAt = document.getElementById('createdAt');
            const expiresAt = document.getElementById('expiresAt');
            const copyContentBtn = document.getElementById('copyContentBtn');

            async function loadNote() {
                console.log('=== Starting to load note ===');
                try {
                    console.log('Fetching note:', `/api/notes/${noteId}`);
                    
                    if (!noteId || noteId === 'note.html') {
                        throw new Error('Invalid note ID');
                    }
                    
                    const response = await fetch(`/api/notes/${noteId}`);
                    console.log('Response status:', response.status);
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || t('loadFailed'));
                    }

                    const note = await response.json();
                    console.log('Note data:', note);
                    console.log('Note content length:', note.content.length);

                    window.currentNoteData = note;
                    noteContent.textContent = note.content;
                    console.log('Content set to element');

                    const lang = getCurrentLanguage();
                    createdAt.textContent = new Date(note.createdAt).toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US');
                    expiresAt.textContent = new Date(note.expiresAt).toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US');
                    
                    loading.classList.add('hidden');
                    error.classList.add('hidden');
                    noteDisplay.classList.remove('hidden');
                    console.log('=== Note loaded successfully ===');
                } catch (err) {
                    console.error('Error loading note:', err);
                    loading.classList.add('hidden');
                    error.classList.remove('hidden');
                    error.querySelector('p').textContent = err.message;
                    console.log('=== Error occurred ===');
                }
            }

            copyContentBtn.addEventListener('click', async function() {
                try {
                    await navigator.clipboard.writeText(noteContent.textContent);
                    copyContentBtn.textContent = t('copied');
                    setTimeout(() => {
                        copyContentBtn.textContent = t('copyContent');
                    }, 2000);
                } catch (error) {
                    const textarea = document.createElement('textarea');
                    textarea.value = noteContent.textContent;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    copyContentBtn.textContent = t('copied');
                    setTimeout(() => {
                        copyContentBtn.textContent = t('copyContent');
                    }, 2000);
                }
            });

            loadNote();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
