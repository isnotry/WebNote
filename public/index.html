<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="only light">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebNote - 在线记事本</title>
    <style>html{background:#F3EEE6;color:#2B2520}</style>
    <script>
        // Prevent FOUC: set theme AND inline bg BEFORE CSS loads
        (function(){
            var t = localStorage.getItem('webnote-theme');
            if (!t) {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
            // Set bg inline on html — highest specificity, no flash possible
            document.documentElement.style.backgroundColor = t === 'dark' ? '#0E0E0E' : '#F3EEE6';
            document.documentElement.style.color = t === 'dark' ? '#FFFFFF' : '#2B2520';
        })();
    </script>
    <style>
:root {
  /* Heatherwick (亮色模式) */
  --bg: #F3EEE6;
  --surface: #EAE2D6;
  --surface-raised: #E2D9CA;
  --text: #2B2520;
  --text-2: #6E6051;
  --border: #D8CDBE;
  --radius-sm: 3px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --primary: #B87333;
  --primary-light: #C99A5B;
  --primary-dark: #A05E22;
  --primary-gradient: linear-gradient(135deg, #B87333 0%, #C99A5B 100%);
  --success: #5B8C5A;
  --danger: #B85C4A;
  --on-primary: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(120,80,40,.08);
  --shadow-md: 0 4px 15px rgba(120,80,40,.12);
  --shadow-lg: 0 10px 30px rgba(120,80,40,.12);
  --bg-glow-1: radial-gradient(80vw 60vw at 80% 0%, rgba(184,115,51,.10), transparent 60%);
  --bg-glow-2: radial-gradient(50vw 50vw at 0% 100%, rgba(140,140,140,.08), transparent 60%);
  --header-text: var(--text);
  --header-muted: var(--text-2);
  --btn-secondary-bg: #DDD2C4;
  --btn-secondary-text: var(--text);
  --btn-secondary-hover: #D0C5B5;
  --input-bg: #F7F3ED;
}

/* data-theme driven, no @media query needed */
:root[data-theme="light"] {
  --bg: #F3EEE6; --surface: #EAE2D6; --surface-raised: #E2D9CA;
  --text: #2B2520; --text-2: #6E6051; --border: #D8CDBE;
  --radius-sm: 3px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
  --primary: #B87333; --primary-light: #C99A5B; --primary-dark: #A05E22;
  --primary-gradient: linear-gradient(135deg, #B87333 0%, #C99A5B 100%);
  --success: #5B8C5A; --danger: #B85C4A;
  --on-primary: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(120,80,40,.08);
  --shadow-md: 0 4px 15px rgba(120,80,40,.12);
  --shadow-lg: 0 10px 30px rgba(120,80,40,.12);
  --bg-glow-1: radial-gradient(80vw 60vw at 80% 0%, rgba(184,115,51,.10), transparent 60%);
  --bg-glow-2: radial-gradient(50vw 50vw at 0% 100%, rgba(140,140,140,.08), transparent 60%);
  --header-text: #2B2520;
  --header-muted: #6E6051;
  --btn-secondary-bg: #DDD2C4;
  --btn-secondary-text: #2B2520;
  --btn-secondary-hover: #D0C5B5;
  --input-bg: #F7F3ED;
}

:root[data-theme="dark"] {
  --bg: #0E0E0E; --surface: #161616; --surface-raised: #1E1E1E;
  --text: #FFFFFF; --text-2: #BBBBBB; --border: #333333;
  --radius-sm: 2px; --radius-md: 6px; --radius-lg: 10px; --radius-xl: 14px;
  --primary: #FF6A00; --primary-light: #FFB066; --primary-dark: #CC5500;
  --primary-gradient: linear-gradient(135deg, #FF6A00 0%, #FFB066 100%);
  --success: #66BB6A; --danger: #EF5350;
  --on-primary: #0E0E0E;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 15px rgba(0,0,0,.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  --bg-glow-1: radial-gradient(120vw 120vw at 50% -10%, rgba(255,106,0,.10), transparent 55%);
  --bg-glow-2: none;
  --header-text: #FFFFFF;
  --header-muted: #BBBBBB;
  --btn-secondary-bg: #2A2A2A;
  --btn-secondary-text: #FFFFFF;
  --btn-secondary-hover: #3A3A3A;
  --input-bg: #1A1A1A;
}

    </style>
    <link rel="stylesheet" href="/styles.css?v=2">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <h1 class="title" data-i18n="title">WebNote</h1>
                    <p class="subtitle" data-i18n="subtitle">快速、安全的在线记事本</p>
                </div>
                <div class="header-actions">
                    <button id="themeToggle" class="theme-toggle" title="切换主题">🌙</button>
                    <button id="langSwitch" class="lang-switch-btn" data-i18n="langSwitch">English</button>
                </div>
            </div>
        </header>

        <main class="editor-section">
            <div class="editor-container">
                <textarea 
                    id="noteContent" 
                    class="note-editor" 
                    data-i18n-placeholder="editor.placeholder"
                    placeholder="在这里输入您的笔记内容..."
                    rows="15"
                ></textarea>
            </div>
            
            <div class="actions">
                <button id="createBtn" class="btn btn-primary">
                    <span class="btn-text" data-i18n="editor.createBtn">创建笔记</span>
                    <span class="btn-icon">✨</span>
                </button>
            </div>

            <div id="result" class="result hidden">
                <div class="result-content">
                    <h3 data-i18n="editor.successTitle">笔记创建成功！</h3>
                    <p><span data-i18n="editor.expiryText">您的笔记将在</span> <span id="expiryDate"></span> <span data-i18n="editor.expiresAt">过期</span></p>
                    <div class="link-container">
                        <input 
                            type="text" 
                            id="noteUrl" 
                            class="url-input" 
                            readonly 
                            value=""
                        >
                        <button id="copyBtn" class="btn btn-secondary" data-i18n="editor.copyBtn">
                            复制链接
                        </button>
                    </div>
                    <a id="openBtn" href="" target="_blank" class="link-text" data-i18n="editor.openNote">
                        点击打开笔记 →
                    </a>
                </div>
            </div>
        </main>

        <section class="features">
            <div class="feature">
                <div class="feature-icon">📝</div>
                <h3 data-i18n="features.simple.title">简单易用</h3>
                <p data-i18n="features.simple.description">无需注册，直接开始记录</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <h3 data-i18n="features.temporary.title">临时存储</h3>
                <p data-i18n="features.temporary.description">笔记自动保存7天</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🔗</div>
                <h3 data-i18n="features.share.title">分享链接</h3>
                <p data-i18n="features.share.description">一键生成分享地址</p>
            </div>
        </section>

        <footer class="footer">
            <p data-i18n="footer">WebNote - 您的临时记事本</p>
        </footer>
    </div>

    <script>
                // Theme toggle (init already done in head)
        (function() {
            const root = document.documentElement;
            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                var cur = root.getAttribute('data-theme');
                toggle.textContent = cur === 'dark' ? '☀️' : '🌙';
                toggle.addEventListener('click', function() {
                    var t = root.getAttribute('data-theme');
                    var n = t === 'dark' ? 'light' : 'dark';
                    root.setAttribute('data-theme', n);
                    toggle.textContent = n === 'dark' ? '☀️' : '🌙';
                    localStorage.setItem('webnote-theme', n);
                });
            }
        })();
    </script>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>
</html>
