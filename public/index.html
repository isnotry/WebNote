<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="only light">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebNote - 在线记事本</title>
    <!-- SVG Symbol Sprite -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
      <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="4"/>
        <line x1="12" y1="20" x2="12" y2="22"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="2" y1="12" x2="4" y2="12"/>
        <line x1="20" y1="12" x2="22" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </symbol>
      <symbol id="icon-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="8" y1="13" x2="16" y2="13"/>
        <line x1="8" y1="17" x2="16" y2="17"/>
      </symbol>
      <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </symbol>
      <symbol id="icon-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </symbol>
      <symbol id="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 14.9 9.1 22 11 14.9 12.9 12 20 9.1 12.9 2 11 9.1 9.1 12 2"/>
      </symbol>
    </svg>
    <style>html{background:#F3EEE6;color:#2B2520}</style>
    <script>
        // Prevent FOUC: set theme AND inline bg BEFORE CSS loads
        (function(){
            var t = localStorage.getItem('webnote-theme');
            if (!t) {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
            // Set bg inline on html — highest specificity, no flash possible
            document.documentElement.style.backgroundColor = t === 'dark' ? '#0E0E0E' : '#F3EEE6';
            document.documentElement.style.color = t === 'dark' ? '#FFFFFF' : '#2B2520';
        })();
    </script>
    <style>
:root {
  /* Heatherwick (亮色模式) */
  --bg: #F3EEE6;
  --surface: #EAE2D6;
  --surface-raised: #E2D9CA;
  --text: #2B2520;
  --text-2: #6E6051;
  --border: #D8CDBE;
  --radius-sm: 3px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --primary: #B87333;
  --primary-light: #C99A5B;
  --primary-dark: #A05E22;
  --primary-gradient: linear-gradient(135deg, #B87333 0%, #C99A5B 100%);
  --success: #5B8C5A;
  --danger: #B85C4A;
  --on-primary: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(120,80,40,.08);
  --shadow-md: 0 4px 15px rgba(120,80,40,.12);
  --shadow-lg: 0 10px 30px rgba(120,80,40,.12);
  --bg-glow-1: radial-gradient(80vw 60vw at 80% 0%, rgba(184,115,51,.10), transparent 60%);
  --bg-glow-2: radial-gradient(50vw 50vw at 0% 100%, rgba(140,140,140,.08), transparent 60%);
  --header-text: var(--text);
  --header-muted: var(--text-2);
  --btn-secondary-bg: #DDD2C4;
  --btn-secondary-text: var(--text);
  --btn-secondary-hover: #D0C5B5;
  --input-bg: #F7F3ED;
}

/* data-theme driven, no @media query needed */
:root[data-theme="light"] {
  --bg: #F3EEE6; --surface: #EAE2D6; --surface-raised: #E2D9CA;
  --text: #2B2520; --text-2: #6E6051; --border: #D8CDBE;
  --radius-sm: 3px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
  --primary: #B87333; --primary-light: #C99A5B; --primary-dark: #A05E22;
  --primary-gradient: linear-gradient(135deg, #B87333 0%, #C99A5B 100%);
  --success: #5B8C5A; --danger: #B85C4A;
  --on-primary: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(120,80,40,.08);
  --shadow-md: 0 4px 15px rgba(120,80,40,.12);
  --shadow-lg: 0 10px 30px rgba(120,80,40,.12);
  --bg-glow-1: radial-gradient(80vw 60vw at 80% 0%, rgba(184,115,51,.10), transparent 60%);
  --bg-glow-2: radial-gradient(50vw 50vw at 0% 100%, rgba(140,140,140,.08), transparent 60%);
  --header-text: #2B2520;
  --header-muted: #6E6051;
  --btn-secondary-bg: #DDD2C4;
  --btn-secondary-text: #2B2520;
  --btn-secondary-hover: #D0C5B5;
  --input-bg: #F7F3ED;
}

:root[data-theme="dark"] {
  --bg: #0E0E0E; --surface: #161616; --surface-raised: #1E1E1E;
  --text: #FFFFFF; --text-2: #BBBBBB; --border: #333333;
  --radius-sm: 2px; --radius-md: 6px; --radius-lg: 10px; --radius-xl: 14px;
  --primary: #FF6A00; --primary-light: #FFB066; --primary-dark: #CC5500;
  --primary-gradient: linear-gradient(135deg, #FF6A00 0%, #FFB066 100%);
  --success: #66BB6A; --danger: #EF5350;
  --on-primary: #0E0E0E;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 15px rgba(0,0,0,.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  --bg-glow-1: radial-gradient(120vw 120vw at 50% -10%, rgba(255,106,0,.10), transparent 55%);
  --bg-glow-2: none;
  --header-text: #FFFFFF;
  --header-muted: #BBBBBB;
  --btn-secondary-bg: #2A2A2A;
  --btn-secondary-text: #FFFFFF;
  --btn-secondary-hover: #3A3A3A;
  --input-bg: #1A1A1A;
}

    </style>
    <link rel="stylesheet" href="/styles.css?v=2">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <h1 class="title" data-i18n="title">WebNote</h1>
                    <p class="subtitle" data-i18n="subtitle">快速、安全的在线记事本</p>
                </div>
                <div class="header-actions">
                    <button id="themeToggle" class="theme-toggle" title="切换主题" aria-label="切换主题">
                        <svg class="icon-theme"><use href="#icon-moon"/></svg>
                    </button>
                    <button id="langSwitch" class="lang-switch-btn" data-i18n="langSwitch">English</button>
                </div>
            </div>
        </header>

        <main class="editor-section">
            <div class="editor-container">
                <textarea 
                    id="noteContent" 
                    class="note-editor" 
                    data-i18n-placeholder="editor.placeholder"
                    placeholder="在这里输入您的笔记内容..."
                    rows="15"
                ></textarea>
            </div>
            
            <div class="actions">
                <button id="createBtn" class="btn btn-primary">
                    <span class="btn-text" data-i18n="editor.createBtn">创建笔记</span>
                    <svg class="btn-icon-svg"><use href="#icon-sparkle"/></svg>
                </button>
            </div>

            <div id="result" class="result hidden">
                <div class="result-content">
                    <h3 data-i18n="editor.successTitle">笔记创建成功！</h3>
                    <p><span data-i18n="editor.expiryText">您的笔记将在</span> <span id="expiryDate"></span> <span data-i18n="editor.expiresAt">过期</span></p>
                    <div class="link-container">
                        <input 
                            type="text" 
                            id="noteUrl" 
                            class="url-input" 
                            readonly 
                            value=""
                        >
                        <button id="copyBtn" class="btn btn-secondary" data-i18n="editor.copyBtn">
                            复制链接
                        </button>
                    </div>
                    <a id="openBtn" href="" target="_blank" class="link-text" data-i18n="editor.openNote">
                        点击打开笔记 →
                    </a>
                </div>
            </div>
        </main>

        <section class="features">
            <div class="feature">
                <svg class="feature-icon-svg"><use href="#icon-note"/></svg>
                <h3 data-i18n="features.simple.title">简单易用</h3>
                <p data-i18n="features.simple.description">无需注册，直接开始记录</p>
            </div>
            <div class="feature">
                <svg class="feature-icon-svg"><use href="#icon-lock"/></svg>
                <h3 data-i18n="features.temporary.title">临时存储</h3>
                <p data-i18n="features.temporary.description">笔记自动保存7天</p>
            </div>
            <div class="feature">
                <svg class="feature-icon-svg"><use href="#icon-link"/></svg>
                <h3 data-i18n="features.share.title">分享链接</h3>
                <p data-i18n="features.share.description">一键生成分享地址</p>
            </div>
        </section>

        <footer class="footer">
            <p>
                <span data-i18n="footer">WebNote - 您的临时记事本</span><br />
                <a class="footer-link" href="https://github.com/isnotry/WebNote" target="_blank" rel="noopener noreferrer" data-i18n="repoLink">GitHub 开源仓库</a>
            </p>
        </footer>
    </div>

    <script>
                // Theme toggle (init already done in head)
        (function() {
            const root = document.documentElement;
            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                var cur = root.getAttribute('data-theme');
                var svg = toggle.querySelector('svg use');
                if (svg) svg.setAttribute('href', '#icon-' + (cur === 'dark' ? 'sun' : 'moon'));
                toggle.addEventListener('click', function() {
                    var t = root.getAttribute('data-theme');
                    var n = t === 'dark' ? 'light' : 'dark';
                    root.setAttribute('data-theme', n);
                    var u = svg && svg.getAttribute('href');
                    if (svg) svg.setAttribute('href', '#icon-' + (n === 'dark' ? 'sun' : 'moon'));
                    localStorage.setItem('webnote-theme', n);
                });
            }
        })();
    </script>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>
</html>
