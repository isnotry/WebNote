<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记未找到 - WebNote</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page {
            background: white;
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 2rem;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .error-message {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .lang-switch-btn {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .lang-switch-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        .lang-switch-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="/" class="back-link" data-i18n="errors.notfound.createNew">创建新笔记</a>
            <button id="langSwitch" class="lang-switch-btn" data-i18n="langSwitch">English</button>
        </div>
        
        <div class="error-page">
            <div class="error-icon" data-i18n="errors.notfound.icon">🔍</div>
            <h1 class="error-title" data-i18n="errors.notfound.title">笔记未找到</h1>
            <p class="error-message" data-i18n="errors.notfound.message">
                很抱歉，您访问的笔记不存在或已被删除。<br>
                请检查链接是否正确，或者创建一个新笔记。
            </p>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                const translation = t(key);
                if (translation) {
                    element.textContent = translation;
                }
            });

            const langSwitchBtn = document.getElementById('langSwitch');
            if (langSwitchBtn) {
                langSwitchBtn.addEventListener('click', function() {
                    const currentLang = getCurrentLanguage();
                    const newLang = currentLang === 'zh' ? 'en' : 'zh';
                    setLanguage(newLang);
                });
            }
        });
    </script>
</body>
</html>
